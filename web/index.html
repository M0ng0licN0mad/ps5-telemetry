<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 telemetry</title>
<style>
:root{--bg:#0f1722;--panel:#16212f;--line:#26364a;--text:#e6edf5;--muted:#8397ad}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:18px;font-weight:600;margin:0}
#status{font-size:13px;color:var(--muted)}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5534b;margin-right:6px}
#status.ok::before{background:#4fd1a5}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:150px 1fr;gap:4px 14px;align-items:center}
.label{font-size:14px;color:var(--muted)}
.val{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.sub{font-size:12px;color:var(--muted);min-height:16px}
canvas{width:100%;height:64px;grid-row:1/4;grid-column:2}
@media(max-width:420px){.row{grid-template-columns:1fr}canvas{grid-row:auto;grid-column:auto}}
</style></head><body><main>
<header><h1>PS5 telemetry</h1><span id="status">Connecting</span></header>
<div id="rows"></div>
</main>
<script>
const P=new URLSearchParams(location.search).get('ps5');
const BASE=P?'http://'+P+':9090':'';
const N=90;
const M=[
 {k:'cpu',l:'CPU',u:'%',c:'#5aa9ff',max:()=>100,v:d=>d.cpu,sub:d=>d.cpu==null?'Warming up':''},
 {k:'gpu',l:'GPU',u:'%',c:'#b48cff',max:()=>100,v:d=>d.gpu,sub:d=>d.gpu==null?'No GPU source yet (see README)':''},
 {k:'ram',l:'Memory',u:'%',c:'#4fd1a5',max:()=>100,v:d=>d.ram_total_mb?100*d.ram_used_mb/d.ram_total_mb:null,
  sub:d=>d.ram_total_mb?(d.ram_used_mb/1024).toFixed(1)+' of '+(d.ram_total_mb/1024).toFixed(1)+' GB':'Memory counters unavailable'},
 {k:'ft',l:'Frame time',u:'ms',c:'#ffb454',max:h=>Math.max(33.3,...h.filter(x=>x!=null)),v:d=>d.frametime_ms,
  sub:d=>d.frametime_ms==null?'Waiting for frame data':(1000/d.frametime_avg_ms).toFixed(0)+' fps average'}
];
const rows=document.getElementById('rows');
M.forEach(m=>{m.h=Array(N).fill(null);
 const r=document.createElement('div');r.className='row';
 r.innerHTML='<div class="label">'+m.l+'</div><canvas></canvas><div class="val">–</div><div class="sub"></div>';
 rows.appendChild(r);m.cv=r.querySelector('canvas');m.ve=r.querySelector('.val');m.se=r.querySelector('.sub');});
function draw(m){
 const cv=m.cv,dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 const mx=m.max(m.h);x.strokeStyle=m.c;x.lineWidth=2;x.lineJoin='round';
 let pen=false;x.beginPath();
 m.h.forEach((v,i)=>{if(v==null){pen=false;return}
  const px=i/(N-1)*w,py=h-2-Math.min(v/mx,1)*(h-4);
  pen?x.lineTo(px,py):x.moveTo(px,py);pen=true});
 x.stroke();
}
function render(d){
 M.forEach(m=>{const v=m.v(d);m.h.push(v);m.h.shift();
  m.ve.innerHTML=v==null?'n/a':v.toFixed(m.k==='ft'?1:0)+'<small>'+m.u+'</small>';
  m.se.textContent=m.sub(d);draw(m)});
}
const st=document.getElementById('status');
async function tick(){
 try{const r=await fetch(BASE+'/stats',{cache:'no-store'});render(await r.json());
  st.textContent='Live';st.className='ok'}
 catch(e){st.textContent='Console unreachable';st.className=''}
}
tick();setInterval(tick,500);
</script></body></html>
