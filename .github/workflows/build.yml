name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y clang lld unzip python3
      - name: Install ps5-payload-sdk
        run: |
          curl -fL -o sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-elf
          path: telemetry.elf
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: telemetry.elf
